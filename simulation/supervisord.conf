[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log

[program:simulation]
command=/app/simulation/simulation
autorestart=true
stdout_logfile=/var/log/supervisor/simulation.log
stderr_logfile=/var/log/supervisor/simulation.err

[program:modbus]
directory=/app/modbus
command=/app/modbus/run_all.sh
autorestart=true
stdout_logfile=/var/log/supervisor/modbus.log
stderr_logfile=/var/log/supervisor/modbus.err

# Ambient noise-floor scheduler - see noise_floor/scheduler.py. Always
# running, but defaults to a no-op "quiet" state until explicitly enabled
# via the dashboard (noise_floor_enabled in web_visualization/data/index.php).
[program:noise_floor]
command=python3 /app/noise_floor/scheduler.py
autorestart=true
stdout_logfile=/var/log/supervisor/noise_floor.log
stderr_logfile=/var/log/supervisor/noise_floor.err

# Benign ARP churn - see noise_floor/arp_churn.py. Same always-on,
# defaults-to-quiet convention as noise_floor above; uses the Docker
# socket to create/destroy short-lived containers, not the simulator's
# control socket.
[program:arp_churn]
command=python3 /app/noise_floor/arp_churn.py
autorestart=true
stdout_logfile=/var/log/supervisor/arp_churn.log
stderr_logfile=/var/log/supervisor/arp_churn.err
