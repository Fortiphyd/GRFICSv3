[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log

[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 1280x720x24 -ac +extension GLX +render -noreset
autorestart=true
stdout_logfile=/var/log/xvfb.log
stderr_logfile=/var/log/xvfb.err
priority=10

[program:xfce]
command=su - kali -c "export DISPLAY=:1; exec startxfce4"
autorestart=true
stdout_logfile=/var/log/xfce.log
stderr_logfile=/var/log/xfce.err
priority=30

[program:x11vnc]
command=/bin/bash -lc "x11vnc -display :1 -forever -shared -rfbport 5900 -repeat -noxdamage -o /var/log/x11vnc.log"
autorestart=true
stdout_logfile=/var/log/x11vnc.out
stderr_logfile=/var/log/x11vnc.err
priority=40

[program:novnc]
command=/bin/bash -lc "/opt/noVNC/utils/novnc_proxy --vnc localhost:5900 --listen 6080"
autorestart=true
stdout_logfile=/var/log/novnc.out
stderr_logfile=/var/log/novnc.err
priority=50

# Cyber fault-injection tooling (see docs/cyber-vs-physical-fault-injection-design.md).
# C2 handler for the compromised-HMI beacon model: always listening, since
# it represents persistent attacker infrastructure, not something an
# instructor "starts" as part of triggering a scenario. Queuing a command
# for the implant to pick up on its next check-in is done by writing to
# /tmp/c2_pending_command.json (see the script's own docstring) - no
# dashboard control surface for this yet.
[program:c2-listener]
command=/usr/bin/python3 /opt/cyber_injects/c2_listener.py
autorestart=true
stdout_logfile=/var/log/c2-listener.out
stderr_logfile=/var/log/c2-listener.err
priority=60
