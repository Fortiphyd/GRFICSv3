[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log

[program:zeek]
command=/usr/lib/grfics/zeek-start.sh
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/zeek-stdout.log
stderr_logfile=/var/log/supervisor/zeek-stderr.log

[program:wazuh-agent]
command=/bin/bash -c "if getent hosts wazuh >/dev/null 2>&1; then /var/ossec/bin/wazuh-control start; else echo '[zeek] Wazuh not in DNS, skipping agent start'; fi; sleep infinity"
autostart=true
autorestart=false
stdout_logfile=/var/log/supervisor/wazuh-agent.log
stderr_logfile=/var/log/supervisor/wazuh-agent.err
