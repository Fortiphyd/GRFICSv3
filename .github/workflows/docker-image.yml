name: Build and Push Multi-Arch Docker Images


permissions:
  contents: read
  id-token: write


on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  release:
    types: [ published ]
  workflow_dispatch: {}

env:
  DOCKERHUB_NAMESPACE: fortiphyd
  DOCKER_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}

jobs:

  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set-services.outputs.services }}
      smoke_services: ${{ steps.set-services.outputs.smoke_services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: set-services
        run: |
          set -e

          SERVICES=()
          BASE_REF="${{ github.event.before }}"
          if [ -z "$BASE_REF" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              # manual runs are usually "does this branch's stack still work",
              # so diff against main rather than just the last commit
              BASE_REF="origin/main"
            else
              BASE_REF="$(git rev-parse HEAD~1)"
            fi
          fi

          CHANGED=$(git diff --name-only "$BASE_REF" HEAD)

          echo "Changed files:"
          echo "$CHANGED"

          declare -A MAP=(
            ["plc"]="plc/"
            ["router"]="router/"
            ["workstation"]="workstation/"
            ["simulation"]="simulation/"
            ["scadalts"]="scadalts/"
            ["attacker"]="attacker/"
            ["caldera"]="caldera/"
            ["wazuh"]="wazuh/"
          )

          # rebuild everything on release
          if [ "${{ github.event_name }}" = "release" ]; then
            SERVICES=("${!MAP[@]}")
          else
            for SERVICE in "${!MAP[@]}"; do
              if echo "$CHANGED" | grep -q "^${MAP[$SERVICE]}"; then
                SERVICES+=("$SERVICE")
              fi
            done

            # If shared files changed, rebuild everything
            if echo "$CHANGED" | grep -Eq "^(docker-compose.yml|\.github/)"; then
              SERVICES=("${!MAP[@]}")
            fi
          fi

          echo "services=$(printf '%s\n' "${SERVICES[@]}" | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

          # ----------------------------------------------------------------
          # Smoke test scope: which docker-compose services to bring up and
          # health-check. This is NOT just "smoke-test whatever image list
          # changed" - most of these services only work meaningfully wired
          # together on the ICS/DMZ macvlan networks, and a per-container
          # healthcheck alone (e.g. the PLC's own web UI coming up) can't
          # catch a wiring regression between them. So: if anything in the
          # OT-networked core changed, bring up the whole core group
          # together; a genuinely standalone service can be smoke-tested on
          # its own (plus the router, for basic reachability). wazuh is
          # deliberately excluded - optional siem profile, heavy ELK stack,
          # not part of the default `docker compose up`.
          declare -A COMPOSE_SERVICE=(
            ["plc"]="plc"
            ["router"]="router"
            ["workstation"]="ews"
            ["simulation"]="simulation"
            ["scadalts"]="hmi"
            ["attacker"]="kali"
            ["caldera"]="caldera"
          )
          CORE_GROUP=(simulation plc router workstation scadalts)
          STANDALONE=(attacker caldera)

          SMOKE_SERVICES=()
          if [ "${{ github.event_name }}" = "release" ] || echo "$CHANGED" | grep -Eq "^(docker-compose\.yml|\.github/)"; then
            SMOKE_SERVICES=("${CORE_GROUP[@]}" "${STANDALONE[@]}")
          else
            CORE_CHANGED=false
            for s in "${SERVICES[@]}"; do
              for c in "${CORE_GROUP[@]}"; do
                if [ "$s" = "$c" ]; then CORE_CHANGED=true; fi
              done
            done

            if [ "$CORE_CHANGED" = true ]; then
              SMOKE_SERVICES+=("${CORE_GROUP[@]}")
            fi

            for s in "${SERVICES[@]}"; do
              for st in "${STANDALONE[@]}"; do
                if [ "$s" = "$st" ]; then
                  SMOKE_SERVICES+=("$st")
                  if [ "$CORE_CHANGED" = false ]; then
                    SMOKE_SERVICES+=("router")
                  fi
                fi
              done
            done

            if [ "${#SMOKE_SERVICES[@]}" -gt 0 ]; then
              mapfile -t SMOKE_SERVICES < <(printf '%s\n' "${SMOKE_SERVICES[@]}" | sort -u)
            fi
          fi

          SMOKE_COMPOSE_SERVICES=()
          for s in "${SMOKE_SERVICES[@]}"; do
            SMOKE_COMPOSE_SERVICES+=("${COMPOSE_SERVICE[$s]}")
          done

          echo "Smoke-test services: ${SMOKE_COMPOSE_SERVICES[*]:-(none)}"
          echo "smoke_services=$(printf '%s\n' "${SMOKE_COMPOSE_SERVICES[@]}" | jq -R . | jq -cs 'map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  # ================================================================
  # Build AMD64 images
  # ================================================================
  build-amd64:
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-tags: true
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: fortiphyd
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute build metadata
        id: meta
        run: |
          echo "version=$(git describe --tags --always 2>/dev/null || echo '${{ github.sha }}' | cut -c1-8)" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_OUTPUT"

      - name: Build and push amd64 images
        run: |
          SERVICES=$(echo '${{ needs.detect-changes.outputs.services }}' | jq -r '.[]')
          set -euo pipefail
          for SERVICE in $SERVICES; do
            if [ ! -d "./${SERVICE}" ]; then
              echo "⚠️ Skipping ${SERVICE}: directory does not exist"
              continue
            fi
            IMAGE="${DOCKERHUB_NAMESPACE}/grfics-${SERVICE}"
            echo "🚀 Building ${IMAGE}:${DOCKER_TAG} (amd64)"

            # SBOM/provenance attestation is disabled entirely: it hits
            # BuildKit's ~40MiB attestation blob size limit on any
            # sufficiently large image (hit attacker/kali first, then wazuh -
            # a recurring pattern, not a one-off), and per-service exceptions
            # are a losing game as base images keep growing.
            # https://github.com/moby/buildkit/issues/2773
            docker buildx build \
              --platform linux/amd64 \
              --tag "${IMAGE}:${DOCKER_TAG}-amd64" \
              --push \
              --cache-from type=gha \
              --cache-to type=gha,mode=max \
              --build-arg "BUILD_VERSION=${{ steps.meta.outputs.version }}" \
              --build-arg "BUILD_CREATED=${{ steps.meta.outputs.created }}" \
              "./${SERVICE}"
          done
          echo "🧹 Cleaning local build cache to free space..."
          docker builder prune -af || true
          docker system prune -af || true

  # ================================================================
  # Build ARM64 images
  # ================================================================
  build-arm64:
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-tags: true
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute build metadata
        id: meta
        run: |
          echo "version=$(git describe --tags --always 2>/dev/null || echo '${{ github.sha }}' | cut -c1-8)" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_OUTPUT"

      - name: Build and push arm64 images
        run: |
          SERVICES=$(echo '${{ needs.detect-changes.outputs.services }}' | jq -r '.[]')
          set -euo pipefail
          for SERVICE in $SERVICES; do
            if [ ! -d "./${SERVICE}" ]; then
              echo "⚠️ Skipping ${SERVICE}: directory does not exist"
              continue
            fi
            IMAGE="${DOCKERHUB_NAMESPACE}/grfics-${SERVICE}"
            echo "🚀 Building ${IMAGE}:${DOCKER_TAG} (arm64)"

            # SBOM/provenance attestation is disabled entirely: it hits
            # BuildKit's ~40MiB attestation blob size limit on any
            # sufficiently large image (hit attacker/kali first, then wazuh -
            # a recurring pattern, not a one-off), and per-service exceptions
            # are a losing game as base images keep growing.
            # https://github.com/moby/buildkit/issues/2773
            docker buildx build \
              --platform linux/arm64 \
              --tag "${IMAGE}:${DOCKER_TAG}-arm64" \
              --push \
              --cache-from type=gha \
              --cache-to type=gha,mode=max \
              --build-arg "BUILD_VERSION=${{ steps.meta.outputs.version }}" \
              --build-arg "BUILD_CREATED=${{ steps.meta.outputs.created }}" \
              "./${SERVICE}"
          done
          echo "🧹 Cleaning local build cache to free space..."
          docker builder prune -af || true
          docker system prune -af || true

  # ================================================================
  # Combine manifests once both architectures exist
  # ================================================================
  create-manifests:
    runs-on: ubuntu-latest
    needs: [ detect-changes, build-amd64, build-arm64 ]
    if: needs.detect-changes.outputs.services != '[]'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.4.1"

      - name: Create and push multi-arch manifests + sign
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          SERVICES=$(echo '${{ needs.detect-changes.outputs.services }}' | jq -r '.[]')
          for SERVICE in $SERVICES; do
            REPO="${DOCKERHUB_NAMESPACE}/grfics-${SERVICE}"
            IMAGE="${REPO}:${DOCKER_TAG}"

            echo "🔗 Creating multi-arch manifest for ${IMAGE}"
            docker buildx imagetools create \
              -t "${IMAGE}" \
              "${REPO}:${DOCKER_TAG}-amd64" \
              "${REPO}:${DOCKER_TAG}-arm64"
            echo "✅ Multi-arch manifest published for ${IMAGE}"

            echo "🔎 Resolving digest for ${IMAGE}"
            DIGEST="$(docker buildx imagetools inspect "${IMAGE}" --format '{{json .Manifest}}' | jq -r '.digest')"
            echo "🔏 Signing ${IMAGE}@${DIGEST} (keyless, GitHub OIDC, recursive)"
            cosign sign -y "${REPO}@${DIGEST}"
            echo "✅ Signed ${IMAGE}@${DIGEST}"
          done

  # ================================================================
  # Smoke test: bring up the just-published images and verify the
  # stack actually comes up healthy with no obvious startup errors.
  # Scope is decided by detect-changes (see the comment there) - this
  # job just brings up whatever service list it's handed.
  # ================================================================
  smoke-test:
    runs-on: ubuntu-latest
    needs: [ detect-changes, create-manifests ]
    if: needs.detect-changes.outputs.smoke_services != '[]'
    steps:
      - uses: actions/checkout@v4

      # avoid Docker Hub's anonymous-pull rate limit, which shared GH-hosted
      # runner IPs run into far more easily than a real user would
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Bring up smoke-test services
        run: |
          set -euo pipefail
          SERVICES=$(echo '${{ needs.detect-changes.outputs.smoke_services }}' | jq -r '.[]' | tr '\n' ' ')
          echo "Smoke-testing: $SERVICES"
          docker compose pull $SERVICES
          docker compose up -d --no-build $SERVICES

      - name: Wait for services to become healthy
        run: |
          set -euo pipefail
          SERVICES=$(echo '${{ needs.detect-changes.outputs.smoke_services }}' | jq -r '.[]')
          TIMEOUT=300
          ELAPSED=0
          while true; do
            ALL_HEALTHY=true
            for s in $SERVICES; do
              CID=$(docker compose ps -q "$s" || true)
              if [ -z "$CID" ]; then
                echo "$s: no container found"
                ALL_HEALTHY=false
                continue
              fi
              STATUS=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}healthy{{end}}' "$CID")
              echo "$s: $STATUS"
              if [ "$STATUS" != "healthy" ]; then
                ALL_HEALTHY=false
              fi
            done
            if [ "$ALL_HEALTHY" = true ]; then
              echo "✅ All smoke-tested services are healthy"
              break
            fi
            if [ "$ELAPSED" -ge "$TIMEOUT" ]; then
              echo "::error::Timed out waiting for services to become healthy"
              exit 1
            fi
            sleep 5
            ELAPSED=$((ELAPSED + 5))
          done

      - name: Scan logs for obvious errors
        run: |
          set -uo pipefail
          SERVICES=$(echo '${{ needs.detect-changes.outputs.smoke_services }}' | jq -r '.[]')
          # deliberately narrow: broad words like "error" show up in benign
          # startup/retry noise (e.g. healthcheck retries before a service is
          # ready) and would make this check flaky. Widen this pattern only
          # after seeing a real miss, not preemptively.
          PATTERN='(?i)(traceback|unhandled exception|fatal error|panic:|segfault)'
          FOUND=false
          for s in $SERVICES; do
            if docker compose logs "$s" 2>&1 | grep -P "$PATTERN"; then
              echo "::warning::possible error in $s logs (see above)"
              FOUND=true
            else
              echo "$s: no obvious errors"
            fi
          done
          if [ "$FOUND" = true ]; then
            echo "::error::one or more services had a possible error in their logs (see warnings above)"
            exit 1
          fi
          echo "✅ No obvious errors found in logs for: $(echo "$SERVICES" | tr '\n' ' ')"

      - name: Dump state on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
