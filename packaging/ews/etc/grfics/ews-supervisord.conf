[supervisord]
nodaemon=false
logfile=/var/log/grfics-ews-supervisord.log

[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 1280x720x24 -ac +extension GLX +render -noreset
autorestart=true
stdout_logfile=/var/log/grfics-ews-xvfb.log
stderr_logfile=/var/log/grfics-ews-xvfb.err
priority=10

[program:xfce]
command=su - engineer -c "export DISPLAY=:1; exec startxfce4"
autorestart=true
stdout_logfile=/var/log/grfics-ews-xfce.log
stderr_logfile=/var/log/grfics-ews-xfce.err
priority=30

[program:x11vnc]
command=/bin/bash -lc "x11vnc -display :1 -rfbauth /home/engineer/.vnc/passwd -forever -shared -rfbport 5900 -repeat -noxdamage -o /var/log/grfics-ews-x11vnc.log"
autorestart=true
stdout_logfile=/var/log/grfics-ews-x11vnc.out
stderr_logfile=/var/log/grfics-ews-x11vnc.err
priority=40

[program:novnc]
command=/bin/bash -lc "/opt/noVNC/utils/novnc_proxy --vnc localhost:5900 --listen 6080"
autorestart=true
stdout_logfile=/var/log/grfics-ews-novnc.out
stderr_logfile=/var/log/grfics-ews-novnc.err
priority=50
